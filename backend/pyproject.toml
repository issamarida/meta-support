[project]
name = "safeframe"
version = "0.1.0"
description = "Blur people estimated to be under 18 in video, with human review before export."
license = { text = "MIT" }
authors = [{ name = "Issam Arida", email = "issamaarida@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.10",
]

[project.optional-dependencies]
# Heavy ML stack. Tests and CI run without it by injecting fake detectors.
ml = [
  "ultralytics>=8.3",
  "torch>=2.4",
  "transformers>=4.44",
  "pillow>=10",
]

[project.scripts]
safeframe = "safeframe.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safeframe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "models: needs downloaded ML models and the [ml] extra (deselect with -m 'not models')",
]
addopts = "-m 'not models'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom, not a mutable default.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
